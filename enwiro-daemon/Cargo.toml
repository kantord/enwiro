[package]
name = "enwiro-daemon"
version = "0.0.23"
edition = "2024"
description = "Background daemon for enwiro: refreshes the recipe cache and forwards workspace switch events"
license = "GPL-3.0-or-later"
repository.workspace = true

# Tags are `<crate>-v<version>` (release-plz's workspace default), which
# doesn't match binstall's built-in URL guesses, so pkg-url is explicit here.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.signing]
algorithm = "minisign"
pubkey = "RWQowPNA2jR6/GBAZNkd5d6by7LwOPBdEwK1NptQjAPGrB8UhUUHHP8T"

[[bin]]
name = "enwiro-daemon"
path = "src/main.rs"

[features]
# Isolation layer (issue #540, ADR-0006): the daemon's `launch.resolve` runs
# a command inside a microsandbox microVM when a project's `.enwiro.toml`
# declares `isolate = true` and an image/snapshot resolves. Off by default.
# Build/test with `--features container-wrap`. Backend: the `msb` CLI,
# driven as a subprocess -- no other optional deps needed.
container-wrap = ["dep:which"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
dirs = "6"
enwiro-sdk.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
home.workspace = true
jsonrpsee = { version = "=0.26", default-features = false, features = ["server-core", "macros"] }
libc = "0.2"
optative-process-pool = "0.0.9"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1"
system-idle-time = "1.0.4"
tokio = { version = "1.37.0", default-features = false, features = ["net", "io-util", "rt", "rt-multi-thread", "macros", "sync", "time", "process", "signal"] }
tokio-util = { version = "0.7", default-features = false, features = ["codec"] }
tracing.workspace = true
which = { version = "8", optional = true }

[dev-dependencies]
proptest = "=1.11.0"
enwiro-sdk = { workspace = true, features = ["test-helpers"] }
filetime = "=0.2.29"
tempfile = "=3.27.0"
